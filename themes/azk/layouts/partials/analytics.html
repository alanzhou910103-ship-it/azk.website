{{ with site.Params.google_analytics_id }}
<!-- Google Analytics: page and B2B inquiry measurement -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // Only allow campaign fields in the measured URL; never send inquiry fields.
  var analyticsPage = new URL(window.location.href);
  var analyticsParams = new URLSearchParams();
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function(key) {
    if (analyticsPage.searchParams.has(key)) analyticsParams.set(key, analyticsPage.searchParams.get(key).slice(0, 100));
  });
  analyticsPage.search = analyticsParams.toString();
  analyticsPage.hash = '';
  var analyticsReferrer = '';
  try { if (document.referrer) analyticsReferrer = new URL(document.referrer).origin; } catch (error) {}
  gtag('config', {{ . | jsonify | safeJS }}, {
    page_location: analyticsPage.href,
    page_referrer: analyticsReferrer,
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
  window.introckTrack = function(name, parameters) {
    try { gtag('event', name, parameters || {}); } catch (error) {}
  };
</script>
{{ end }}
